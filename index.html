<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Only Hesab's own files and Google's sign-in / Sheets / Picker may run or be contacted. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com https://*.gstatic.com https://*.google.com; connect-src 'self' https://*.googleapis.com https://docs.google.com https://oauth2.googleapis.com; frame-src https://*.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://*.gstatic.com https://*.google.com; font-src 'self' data: https://*.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Hesab</title>
  <meta name="description" content="Weekly budget tracker for your Google Sheet.">
  <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1917" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hesab">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body class="onboarding">
  <main id="view" aria-live="polite">
    <section class="card app-startup" aria-labelledby="startup-title">
      <h1 id="startup-title">Hesab</h1>
      <p>If Hesab stays on this screen, reload the page. If you opened <code>index.html</code> directly from the folder, start a local web server from the Hesab folder:</p>
      <p><code>python -m http.server 5501 --bind 127.0.0.1</code></p>
      <p>Then open <a class="link" href="http://127.0.0.1:5501/">the local Hesab app</a>.</p>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="Add transaction">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab on" data-tab="insights">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4"/><path d="M4 20h16"/><path d="m7 15 4-5 3 3 5-6"/></svg>
      <span>Insights</span>
    </button>
    <button class="tab" data-tab="activity">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
      <span>Activity</span>
    </button>
    <button class="tab" data-tab="lists">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 10.5h10.6L20 7H6.3"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
      <span>Lists</span>
    </button>
  </nav>

  <script src="qrcode.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
